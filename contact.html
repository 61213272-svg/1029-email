  <h1>聯絡我們</h1>

  <form action="https://formsubmit.co/你的Email"
        method="POST">

    <label>姓名：</label>
    <input type="text" name="姓名" required>

    <label>電話：</label>
    <input type="tel" name="電話" required>

    <label>Email：</label>
    <input type="email" name="Email" required>

    <label>聯絡內容：</label>
    <textarea name="聯絡內容" required></textarea>

    <input type="hidden" name="_subject"
           value="網站聯絡表單">

    <button type="submit">送出</button>
  </form>
</body>
